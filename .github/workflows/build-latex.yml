name: Build LaTeX PDFs

on:
  push:
    branches: [ main ]
    paths:
      - 'cv/**'
      - '.github/workflows/build-latex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile cv.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: cv

      - name: Copy PDFs to site root
        run: |
          cp cv/cv.pdf ./cv.pdf

      - name: Commit updated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f cv.pdf
          git diff --staged --quiet || git commit -m "Auto-update resume and CV PDFs"
          git push