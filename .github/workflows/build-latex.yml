name: Build LaTeX PDFs

on:
  push:
    branches: [ main ]
    paths:
      - 'cv/**'
      - '.github/workflows/build-latex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # All three are compiled so CI catches breakage in any of them.
      # cv.pdf and resume.pdf are published; academic-cv.pdf is not.
      - name: Compile all documents
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            cv.tex
            academic-cv.tex
            resume.tex
          working_directory: cv

      - name: Copy published PDFs to site root
        run: |
          cp cv/cv.pdf ./cv.pdf
          cp cv/resume.pdf ./resume.pdf

      - name: Commit updated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f cv.pdf resume.pdf
          git diff --staged --quiet || git commit -m "Auto-update CV and resume PDFs"
          git push